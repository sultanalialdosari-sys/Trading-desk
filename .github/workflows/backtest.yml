name: backtest

# تشغيل يدوي: Actions → backtest → Run workflow
on:
  # تعديل triggers/backtest.txt يشغّله (عشان Claude يقدر يشغّله من المحادثة)
  push:
    paths: ["triggers/backtest.txt"]
  workflow_dispatch:
    inputs:
      days:
        description: "كم يوم تداول؟"
        default: "300"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          set -o pipefail
          rm -f docs/backtest_error.txt
          python backtest.py --days "${{ inputs.days || 300 }}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: always()
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          git add -A docs/
          git diff --cached --quiet || git commit -m "backtest: $(date -u +'%F %H:%M') UTC"
          git pull --rebase -X ours || true
          git push
